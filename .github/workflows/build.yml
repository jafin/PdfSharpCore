name: dotnet package

on:
  push:
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: DotNetBuild
        shell: pwsh
        run: ./ci-build.ps1
      # The Ghostscript.NativeAssets package covers Windows, where ImageMagick loads the
      # Ghostscript DLL in process. On Linux it shells out to the system "gs" delegate instead,
      # so the visual comparison tests still need Ghostscript installed here.
      - name: Install Ghostscript
        run: sudo apt-get install -y ghostscript
      - name: Test
        run: dotnet test --no-restore --verbosity normal /p:CollectCoverage=true /p:CoverletOutputFormat=opencover
      - name: Codecov
        uses: codecov/codecov-action@v3
